<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lenny Growth Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="wave">
            <rect x="2" y="9" width="2.6" height="6" rx="1.3"></rect>
            <rect x="7" y="5" width="2.6" height="14" rx="1.3"></rect>
            <rect x="12" y="2" width="2.6" height="20" rx="1.3"></rect>
            <rect x="17" y="6" width="2.6" height="12" rx="1.3"></rect>
            <rect x="22" y="9" width="0" height="6" rx="1.3" style="display:none"></rect>
          </svg>
        </span>
        <div>
          <h1>Lenny <em>Growth Assistant</em></h1>
          <p id="provider" class="mono">provider: loading</p>
        </div>
      </div>
      <button id="newSession" class="primary" type="button">
        <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        New conversation
      </button>
      <p class="sidebar-label">Recent sessions</p>
      <nav id="sessions" class="sessions" aria-label="Conversation history"></nav>
    </aside>

    <section class="chat-pane" aria-label="Chat">
      <header class="chat-header">
        <div>
          <h2>Chat</h2>
          <p>Grounded in Lenny's Podcast transcripts</p>
        </div>
        <button id="artifactToggle" class="artifact-toggle" type="button" disabled>No artifact</button>
      </header>
      <div id="messages" class="messages"></div>
      <form id="chatForm" class="composer">
        <textarea id="messageInput" rows="1" placeholder="Ask about product, growth, startups, or request a Ship 30 essay…" required></textarea>
        <button type="submit" id="sendBtn" class="send" aria-label="Send message">
          <svg viewBox="0 0 20 20" class="icon send-icon" aria-hidden="true"><path d="M3 10l14-7-5 7 5 7-14-7z" fill="currentColor"/></svg>
          <span class="send-spinner" aria-hidden="true"></span>
        </button>
      </form>
    </section>

    <section id="artifactPane" class="artifact-pane" aria-label="Artifact viewer" aria-hidden="true">
      <div class="artifact-header">
        <h2>Artifact</h2>
        <button id="artifactClose" class="close-btn" type="button" aria-label="Close artifact">x</button>
      </div>
      <div class="artifact-body">
        <iframe id="artifactFrame" sandbox="" title="Generated artifact preview"></iframe>
        <div id="artifactEmpty" class="artifact-empty">
          <svg viewBox="0 0 40 40" class="empty-wave" aria-hidden="true">
            <rect x="2" y="16" width="4" height="8" rx="2"></rect>
            <rect x="10" y="10" width="4" height="20" rx="2"></rect>
            <rect x="18" y="4" width="4" height="32" rx="2"></rect>
            <rect x="26" y="10" width="4" height="20" rx="2"></rect>
            <rect x="34" y="16" width="4" height="8" rx="2"></rect>
          </svg>
          <p>Nothing generated yet.<br>Ask for an essay outline or a growth framework and it'll render here.</p>
        </div>
      </div>
    </section>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
