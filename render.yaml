services:
  - type: web
    name: lenny-growth-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m rag.ingestion
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: AUTO_CREATE_DB
        value: true
      - key: TRANSCRIPT_DIR
        value: podcasts
      - key: RAG_DATA_DIR
        value: data/faiss
      - key: EMBEDDING_MODEL
        value: local-hash-384
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: 3
      - key: DATABASE_URL
        value: sqlite:////tmp/lenny_growth/app.db
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_FAST_MODEL
        sync: false
      - key: GROQ_MAIN_MODEL
        sync: false
